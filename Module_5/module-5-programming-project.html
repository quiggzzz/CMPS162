<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CMPS 162: Module 5 Programming Project</title>
<style>* { font-family: monospace; }</style>
<script>

//--------//
// Events //
//--------//
console.log("Events");

// 1. Change the link (the <a> tag) in the HTML body below such that a hello
//    message is displayed on a click event.
<a href="#" id="myLink">Click me</a>
  console.log("Input Fields");

let link = document.getElementById("myLink");

link.addEventListener("click", function (event) {
  event.preventDefault(); // prevents page jump
  console.log("Hello");
  alert("Hello");
});


//--------------//
// Input Fields //
//--------------//
console.log("Input Fields");
<input type="text" id="myTextField" value="Type here" oninput="changeBackgroundColor()">

// 1. Change the background color to red for the input text field (the <input>
//    tag) in the HTML body when obtaining the focus and change it back to
//    white when the focus is lost.
let input = document.getElementById("myTextField");

// When input gains focus
input.addEventListener("focus", function () {
  input.style.backgroundColor = "red";
});

// When input loses focus
input.addEventListener("blur", function () {
  input.style.backgroundColor = "white";
});  

// 2. Change the background color to the original input background color
let input = document.getElementById("myTextField");

// store original background color
let originalColor = input.style.backgroundColor || "white";

// when focused → change to red
input.addEventListener("focus", function () {
  input.style.backgroundColor = "red";
});

// when focus is lost → restore original color
input.addEventListener("blur", function () {
  input.style.backgroundColor = originalColor;
});
  
// 3. Change the text from the default font color to blue
let input = document.getElementById("myTextField");

// Change text color to blue
input.style.color = "blue";


//--------//
// Images //
//--------//
console.log("Images");

// 1. Add an image to the HTML body (use the <img> tag). Make it disappear when
//    someone clicks on it.
let img = document.getElementById("myImage");

img.addEventListener("click", function () {
  img.style.display = "none";
});
// 2. Mouse over an object having an existing image and by mousing over another image appears in its place
//
let img = document.getElementById("myImage");

img.addEventListener("mouseover", function () {
  img.src = "image2.jpg"; // new image on hover
});

img.addEventListener("mouseout", function () {
  img.src = "image1.jpg"; // original image when mouse leaves
});

//--------//
// Styles //
//--------//
console.log("Styles");

// 1. Use the style to increase the text "The Pirates will advance to the World Series in 2025" 
// Use a paragraph style code and increase the text to 8 em
<p style="font-size: 8em;">
  The Pirates will advance to the World Series in 2025
</p>
// 2. Use the style to decrease the text "The Pirates will advance to the World Series in 2025" 
// Use a paragraph style code and increase the text to 5 em
<p style="font-size: 5em;">
  The Pirates will advance to the World Series in 2025
</p>  



</script>
</head>
<body>
  See console!<br><br>
  <a>Click here for a greeting!</a><br><br>
  <input type="text"><br><br>
  <p>Hello World!</p>
  <div id="div1"
       style="background-color:yellow;"
       onclick="swapColors();">
    Hello
  </div>
  <div id="div2"
       style="background-color:green;"
       onclick="swapColors();">
    World
  </div>
</body>
</html>
