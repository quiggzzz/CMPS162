// 1. Create a way to identify if cookies are enabled
function areCookiesEnabled() {
  document.cookie = "cookieTest=1; SameSite=Strict";
  const enabled = document.cookie.indexOf("cookieTest") !== -1;
  document.cookie = "cookieTest=1; expires=Thu, 01 Jan 1970 00:00:00 UTC";
  return enabled;
}  
// 2. Create a way to set the cookie
function setCookie(name, value, daysToExpire) {
  const date = new Date();
  date.setTime(date.getTime() + (daysToExpire * 24 * 60 * 60 * 1000));
  const expires = "expires=" + date.toUTCString();
  document.cookie = name + "=" + value + ";" + expires + ";path=/;SameSite=Strict";
}  
// 3. Create a way to obtain the cookie and display it on the screen
function getCookie(name) {
  const cookies = document.cookie.split("; ");
  for (let cookie of cookies) {
    const [key, val] = cookie.split("=");
    if (key === name) return val;
  }
  return null;
}

function displayCookie(name) {
  const val = getCookie(name);
  document.getElementById("output").textContent =
    val ? name + " = " + val : "Cookie not found.";
}
